plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT'
}

version = project.mod_version
group = 'com.kingdomcomecombat'
base.archivesName = 'kingdom_come_combat-forge-1.20.1'

java {
    // Gradle/Loom and the PAL compile-time API require a Java 21 compiler;
    // emitted mod classes remain Java 17 for Minecraft 1.20.1.
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.sinytra.org/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://repo.redlance.org/public' }
}

loom {
    runs {
        client { client() }
        server { server() }
    }
    forge {
        mixinConfig 'kingdom_come_combat.mixins.json'
        mixinConfig 'kingdom_come_combat.client.mixins.json'
    }
}

sourceSets.main {
    java.srcDirs = [
            'build/generatedShared',
            'src/main/java'
    ]
    resources.srcDirs = [
            '../build/resources/main',
            '../build/resources/client',
            'src/main/resources'
    ]
    java.exclude 'com/kingdomcomecombat/client/config/KccModMenuIntegration.java'
}

configurations {
    ffapiBundle
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Sinytra's 1.20.1 LTS artifacts predate its current Maven publication;
    // Modrinth exposes the official Forge jar as a normal Maven dependency.
    ffapiBundle "maven.modrinth:Aqlf1Shp:qzoL6HjK"
    modImplementation "maven.modrinth:Aqlf1Shp:qzoL6HjK"
    // The legacy FFAPI distribution is an umbrella jar without a Maven POM.
    // Its actual Forge-mapped API modules are nested in META-INF/jarjar.
    modCompileOnly fileTree('build/ffapi-compile') { include '*.jar' }
    implementation 'io.github.llamalad7:mixinextras-forge:0.3.5'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.5'
    modImplementation "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"

    // PAL has not published a 1.20.1 artifact under its current API. Keep its
    // stable API available while the compatibility implementation is supplied
    // by the 1.20.1 runtime pack.
    // Root Loom has already remapped these stable APIs into the 1.20.1 Yarn
    // namespace. Plain compileOnly avoids Forge treating them as SRG inputs.
    compileOnly fileTree('../.gradle/loom-cache/remapped_mods/remapped/unspecified') {
        include '**/PlayerAnimationLibFabric-1.1.4+mc.1.21.1-ceaf4ab3-*.jar'
        include '**/geckolib-fabric-1.21.7-5.2.1-ceaf4ab3-*.jar'
    }
    implementation 'org.javassist:javassist:3.30.2-GA'
}

tasks.register('extractFfapiCompile', Sync) {
    from({ zipTree(configurations.ffapiBundle.singleFile) }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('ffapi-compile')
}

tasks.register('prepareShared1201', Exec) {
    workingDir '..'
    commandLine './gradlew', '-Ptarget_mc=1.20.1', 'classes', '--console=plain'
}

tasks.register('prepareForge1201Sources', Sync) {
    dependsOn 'prepareShared1201'
    from '../build/generated/versionCompat/main'
    from '../build/generated/versionCompat/client'
    into layout.buildDirectory.dir('generatedShared')
    doLast {
        fileTree(layout.buildDirectory.dir('generatedShared')).matching { include '**/*.java' }.each { File file ->
            file.setText(file.getText('UTF-8').replace(
                    'world.getDamageSources().create(',
                    'com.kingdomcomecombat.forge.LegacyForgeDamageSources.create(world, '
            ), 'UTF-8')
        }
    }
}

tasks.named('compileJava').configure { dependsOn 'prepareForge1201Sources', 'extractFfapiCompile' }
tasks.named('processResources').configure { dependsOn 'prepareShared1201' }

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'forge_version', forge_version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version,
                minecraft_version: minecraft_version,
                forge_version: forge_version
    }
    exclude 'fabric.mod.json'
}
